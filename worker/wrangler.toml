name = "lan-printer-sharing"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 房间:按公网 IP 归一化分房(IPv6 取 /64 前缀,IPv4 取完整地址),同 LAN 归一间。
# 前端可用 ?room=CODE 显式指定分组覆盖。

# 单一房间 DO:维护在线 peer 集合 + 中转 SDP/ICE(纯转发,不存业务数据)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 免费计划要求 DO 用 SQLite 后端(new_sqlite_classes),旧 KV 后端(new_classes)是付费功能
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
