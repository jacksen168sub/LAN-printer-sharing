name = "lan-printer-sharing"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 单一房间 DO:维护在线 peer 集合 + 中转 SDP/ICE(纯转发,不存业务数据)
[[durable_objects.bindings]]
name = "ROOM"
